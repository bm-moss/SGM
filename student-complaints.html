<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complaints – SGM</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .portal-layout{display:flex;min-height:100vh;}
    .portal-sidebar{width:var(--sb-w,256px);background:var(--sidebar-bg,#1e1b4b);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;overflow-y:auto;}
    .portal-main{margin-left:var(--sb-w,256px);flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .msg-thread{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;padding:12px;background:#f1f5f9;border-radius:10px;}
    .msg-bubble{max-width:76%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;}
    .msg-bubble.sent{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 2px 6px rgba(99,102,241,.25);}
    .msg-bubble.received{background:#fff;color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .msg-meta{font-size:11px;margin-top:4px;opacity:.65;}
    .msg-bubble.sent .msg-meta{text-align:right;}
    .conv-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;}
    .conv-item:hover{background:#f8fafc;}
    .conv-item.active{background:#eef2ff;}
    .msg-input-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
    .msg-input-row input{flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:24px;font-size:13.5px;}
    .msg-input-row input:focus{outline:none;border-color:var(--primary);}
  </style>
</head>
<body>
<div class="portal-layout">
  <aside class="portal-sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">🏫</div>
      <div>
        <div class="school-name">SGM</div>
        <div class="school-sub">Student Portal</div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="s-avatar">S</div>
      <div class="user-info">
        <div class="user-name" id="s-name"></div>
        <div class="user-role" id="s-class" style="font-size:11px;color:rgba(255,255,255,.4);"></div>
      </div>
    </div>
    <nav id="s-nav" class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="Auth.logout()" style="color:#ff6b6b;width:100%;">
        <span class="nav-icon">🚪</span> Logout
      </button>
    </div>
  </aside>

  <div class="portal-main">
    <div class="topbar">
      <div class="topbar-title">Complaints & Messages</div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openNewMessage()">+ New Message</button>
      </div>
    </div>

    <div class="page-content">
      <div style="display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:520px;">

        <!-- Conversation list -->
        <div class="card" style="overflow:hidden;">
          <div class="card-header" style="padding:12px 16px;">
            <h3 style="font-size:14px;">Conversations</h3>
          </div>
          <div id="conv-list" style="overflow-y:auto;max-height:520px;"></div>
        </div>

        <!-- Thread -->
        <div class="card" style="display:flex;flex-direction:column;">
          <div id="thread-empty" style="display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;color:var(--text-light);padding:48px;">
            <span style="font-size:44px;">💬</span>
            <p style="font-size:14px;">Select a conversation or start a new one</p>
          </div>
          <div id="thread-content" style="display:none;flex-direction:column;flex:1;">
            <div class="card-header" style="padding:12px 18px;">
              <div>
                <div style="font-weight:700;font-size:14px;" id="thread-title"></div>
                <div style="font-size:12px;color:var(--text-muted);" id="thread-sub"></div>
              </div>
              <span id="thread-badge"></span>
            </div>
            <div style="padding:14px 18px;flex:1;display:flex;flex-direction:column;">
              <div class="msg-thread" id="msg-thread"></div>
              <div class="msg-input-row" id="msg-input-row">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendReply()" />
                <button class="btn btn-primary btn-sm" onclick="sendReply()" style="border-radius:24px;padding:8px 16px;">Send ➤</button>
              </div>
              <div id="msg-closed" style="display:none;text-align:center;padding:10px;background:var(--surface2);border-radius:8px;color:var(--text-muted);font-size:13px;margin-top:8px;"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- New Message Modal -->
<div class="modal-overlay" id="new-msg-modal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3>New Message</h3>
      <button class="modal-close" onclick="closeModal('new-msg-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Send To</label>
        <select id="recv-role" onchange="populateReceivers()">
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Receiver *</label>
        <select id="recv-id"><option value="">— Select —</option></select>
      </div>
      <div class="form-group">
        <label>Subject *</label>
        <input type="text" id="msg-subject" placeholder="e.g. Question about my Math grade" />
      </div>
      <div class="form-group">
        <label>Message *</label>
        <textarea id="msg-body" placeholder="Write your message..." style="min-height:100px;"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('new-msg-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="sendNewMessage()">Send</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/student-common.js"></script>
<script>
  const ctx = initStudentPortal();
  if (!ctx) throw new Error('init failed');
  const { user, studentRecord } = ctx;

  buildStudentSidebar('complaints', user, studentRecord);

  let activeId = null;
  const statusMap = { open:'badge-danger','in-progress':'badge-warning',resolved:'badge-success',closed:'badge-secondary' };

  function getMine() {
    return (DB.get('complaints') || [])
      .filter(c => c.submitterId === user.id)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }

  function renderList() {
    const convs = getMine();
    document.getElementById('conv-list').innerHTML = convs.length
      ? convs.map(c => {
          const hasNew = c.messages && c.messages.length > 0 && (!c.readBy || !c.readBy.includes(user.id));
          return `<div class="conv-item ${activeId===c.id?'active':''}" onclick="openThread('${c.id}')">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
              <span style="font-weight:${hasNew?'700':'600'};font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.title}</span>
              ${hasNew?'<span style="width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0;"></span>':''}
            </div>
            <div style="font-size:11.5px;color:var(--text-muted);display:flex;justify-content:space-between;">
              <span>To: ${c.receiverName||'—'}</span>
              <span class="badge ${statusMap[c.status]||'badge-secondary'}" style="font-size:10px;">${c.status}</span>
            </div>
          </div>`;
        }).join('')
      : '<div style="padding:28px;text-align:center;color:var(--text-light);font-size:13px;">No messages yet.<br>Click + New Message.</div>';
  }

  function openThread(id) {
    activeId = id;
    const complaints = DB.get('complaints') || [];
    const idx = complaints.findIndex(c => c.id === id);
    if (idx === -1) return;
    const c = complaints[idx];

    // Mark read
    if (!c.readBy) c.readBy = [];
    if (!c.readBy.includes(user.id)) {
      c.readBy.push(user.id);
      DB.set('complaints', complaints);
    }

    document.getElementById('thread-empty').style.display = 'none';
    document.getElementById('thread-content').style.display = 'flex';
    document.getElementById('thread-title').textContent = c.title;
    document.getElementById('thread-sub').textContent = 'To: ' + (c.receiverName||'—') + (c.receiverRole ? ' ('+c.receiverRole+')' : '');
    document.getElementById('thread-badge').innerHTML = `<span class="badge ${statusMap[c.status]||'badge-secondary'}">${c.status}</span>`;

    const allMsgs = [
      { from: 'student', fromName: 'You', text: c.description, time: c.createdAt },
      ...(c.messages || []).map(m => ({
        from: m.fromId === user.id ? 'student' : 'received',
        fromName: m.fromId === user.id ? 'You' : (m.fromName || c.receiverName || 'Teacher'),
        text: m.text, time: m.time
      }))
    ];

    document.getElementById('msg-thread').innerHTML = allMsgs.map(m => `
      <div class="msg-bubble ${m.from==='student'?'sent':'received'}">
        ${m.text}
        <div class="msg-meta">${m.fromName} · ${formatDate(m.time)}</div>
      </div>`).join('');

    const closed = c.status === 'resolved' || c.status === 'closed';
    document.getElementById('msg-input-row').style.display = closed ? 'none' : 'flex';
    document.getElementById('msg-closed').style.display = closed ? 'block' : 'none';
    document.getElementById('msg-closed').textContent = '✅ This conversation is ' + c.status + '.';

    setTimeout(() => {
      const t = document.getElementById('msg-thread');
      if (t) t.scrollTop = t.scrollHeight;
    }, 40);

    renderList();
    // Update sidebar badge
    buildStudentSidebar('complaints', user, studentRecord);
  }

  function sendReply() {
    const text = document.getElementById('msg-input').value.trim();
    if (!text || !activeId) return;
    const complaints = DB.get('complaints') || [];
    const idx = complaints.findIndex(c => c.id === activeId);
    if (idx === -1) return;
    if (!complaints[idx].messages) complaints[idx].messages = [];
    complaints[idx].messages.push({ fromId: user.id, fromName: user.name, text, time: new Date().toISOString() });
    complaints[idx].readBy = [user.id];
    DB.set('complaints', complaints);
    document.getElementById('msg-input').value = '';
    openThread(activeId);
    toast('Sent', 'success');
  }

  function populateReceivers() {
    const role = document.getElementById('recv-role').value;
    const sel = document.getElementById('recv-id');
    sel.innerHTML = '<option value="">— Select —</option>';

    if (role === 'teacher') {
      const allTeachers = DB.get('teachers') || [];
      const classes = DB.get('classes') || [];
      const grades = DB.get('grades') || [];
      const myClass = studentRecord.class;

      // Homeroom teacher of the class
      const classRecord = classes.find(c => c.name === myClass);
      const homeroomId = classRecord ? classRecord.classTeacher : null;

      // Subject teachers who have graded this class
      const subjectTeacherIds = new Set(
        grades.filter(g => g.class === myClass).map(g => {
          // Match teacher by subjects array or legacy subject field
          const t = allTeachers.find(t => {
            const subs = t.subjects && t.subjects.length ? t.subjects : (t.subject ? [t.subject] : []);
            return subs.includes(g.subject);
          });
          return t ? t.id : null;
        }).filter(Boolean)
      );
      if (homeroomId) subjectTeacherIds.add(homeroomId);

      const myTeachers = allTeachers.filter(t => subjectTeacherIds.has(t.id));

      if (!myTeachers.length) {
        sel.innerHTML = '<option value="">No teachers assigned to your class yet</option>';
        return;
      }
      myTeachers.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id; o.dataset.name = t.name; o.dataset.role = 'teacher';
        o.textContent = t.name + ' – ' + t.subject + (t.id === homeroomId ? ' ⭐' : '');
        sel.appendChild(o);
      });
    } else {
      (DB.get('accounts') || []).filter(a => a.role === 'admin' && a.active).forEach(a => {
        const o = document.createElement('option');
        o.value = a.id; o.dataset.name = a.name; o.dataset.role = 'admin';
        o.textContent = a.name;
        sel.appendChild(o);
      });
    }
  }

  function openNewMessage() {
    document.getElementById('recv-role').value = 'teacher';
    document.getElementById('msg-subject').value = '';
    document.getElementById('msg-body').value = '';
    populateReceivers();
    openModal('new-msg-modal');
  }

  function sendNewMessage() {
    const recvSel = document.getElementById('recv-id');
    const recvId = recvSel.value;
    const recvOpt = recvSel.options[recvSel.selectedIndex];
    const recvName = recvOpt ? (recvOpt.dataset.name || recvOpt.textContent) : '';
    const recvRole = document.getElementById('recv-role').value;
    const subject = document.getElementById('msg-subject').value.trim();
    const body = document.getElementById('msg-body').value.trim();

    if (!recvId) { toast('Select a receiver', 'error'); return; }
    if (!subject) { toast('Subject is required', 'error'); return; }
    if (!body) { toast('Message is required', 'error'); return; }

    let receiverAccountId = recvId;
    if (recvRole === 'teacher') {
      const acc = (DB.get('accounts') || []).find(a => a.linkedId === recvId && a.role === 'teacher');
      if (acc) receiverAccountId = acc.id;
    }

    const complaints = DB.get('complaints') || [];
    const newConv = {
      id: 'cmp_' + Date.now(),
      title: subject, description: body,
      submittedBy: user.name, submitterId: user.id, submitterRole: 'student',
      receiverRole: recvRole, receiverRecordId: recvId,
      receiverId: receiverAccountId, receiverName: recvName,
      priority: 'medium', status: 'open',
      createdAt: new Date().toISOString(),
      messages: [], readBy: [user.id]
    };
    complaints.push(newConv);
    DB.set('complaints', complaints);

    closeModal('new-msg-modal');
    activeId = newConv.id;
    renderList();
    openThread(newConv.id);
    toast('Message sent to ' + recvName, 'success');
  }

  renderList();
</script>
</body>
</html>
