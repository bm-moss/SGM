<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – SGM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">🏫</div>
      <div>
        <div class="school-name">SGM</div>
        <div class="school-sub">School Management</div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-user-avatar">A</div>
      <div class="user-info">
        <div class="user-name" id="sidebar-user-name">Loading...</div>
        <div class="user-role" id="sidebar-user-role">role</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="Auth.logout()" style="color:#ff6b6b;">
        <span class="nav-icon">🚪</span> Logout
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <span id="topbar-date" style="font-size:13px;color:#5f6368;"></span>
        <button class="btn btn-outline btn-sm" onclick="resetAllData()" style="color:#ea4335;border-color:#ea4335;">🔄 Reset Data</button>
        <button class="btn btn-outline btn-sm" id="export-btn" onclick="exportData()" style="display:none;">⬇️ Export</button>
      </div>
    </div>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Two columns -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;" id="dashboard-grid">
        <!-- Recent Students -->
        <div class="card">
          <div class="card-header">
            <h3>Recent Students</h3>
            <a href="students.html" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Name</th><th>Class</th><th>Status</th></tr></thead>
              <tbody id="recent-students"></tbody>
            </table>
          </div>
        </div>

        <!-- Top Performers -->
        <div class="card">
          <div class="card-header">
            <h3>Top Performers</h3>
            <a href="grades.html" class="btn btn-outline btn-sm">View Ranks</a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Rank</th><th>Student</th><th>Avg</th></tr></thead>
              <tbody id="top-performers"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Grade Distribution -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header"><h3>Grade Distribution</h3></div>
        <div class="card-body">
          <div id="grade-dist" style="display:flex;gap:16px;flex-wrap:wrap;"></div>
        </div>
      </div>

      <!-- Quick Links -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;">
        <a href="attendance.html" style="text-decoration:none;"><div class="card" style="padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''"><div style="font-size:32px;margin-bottom:8px;">📅</div><div style="font-weight:700;">Attendance</div></div></a>
        <a href="grades.html" style="text-decoration:none;"><div class="card" style="padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''"><div style="font-size:32px;margin-bottom:8px;">📊</div><div style="font-weight:700;">Grades & Ranks</div></div></a>
        <a href="departments.html" style="text-decoration:none;"><div class="card" style="padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''"><div style="font-size:32px;margin-bottom:8px;">🏢</div><div style="font-weight:700;">Departments</div></div></a>
        <a href="complaints.html" style="text-decoration:none;"><div class="card" style="padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''"><div style="font-size:32px;margin-bottom:8px;">📣</div><div style="font-weight:700;">Complaints</div></div></a>
        <a href="reports.html" style="text-decoration:none;"><div class="card" style="padding:20px;text-align:center;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''"><div style="font-size:32px;margin-bottom:8px;">📋</div><div style="font-weight:700;">Reports</div></div></a>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const user = Auth.requireAuth();
  buildSidebar('dashboard');

  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  // Show export button for admin only
  if (Auth.isAdmin()) document.getElementById('export-btn').style.display = '';

  function exportData() {
    const keys = ['accounts','teachers','students','staff','grades','attendance','complaints','departments','classes'];
    const data = {};
    keys.forEach(k => { data[k] = DB.get(k) || []; });
    data._exported = new Date().toISOString();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'school_data_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported', 'success');
  }

  const students = DB.get('students') || [];
  const teachers = DB.get('teachers') || [];
  const staff = DB.get('staff') || [];
  const grades = DB.get('grades') || [];
  const att = DB.get('attendance') || [];
  const complaints = DB.get('complaints') || [];
  const today = new Date().toISOString().split('T')[0];
  const presentToday = att.filter(a => a.date === today && a.status === 'present').length;
  const openComplaints = complaints.filter(c => c.status === 'open').length;

  // Stats
  const statsData = [
    { icon: '🎓', label: 'Total Students', value: students.length, color: 'blue' },
    { icon: '👨‍🏫', label: 'Teachers', value: teachers.length, color: 'green' },
    { icon: '✅', label: 'Present Today', value: presentToday, color: 'orange' },
    { icon: '📣', label: 'Open Complaints', value: openComplaints, color: 'red' }
  ];

  document.getElementById('stats-grid').innerHTML = statsData.map(s => `
    <div class="stat-card">
      <div class="stat-icon ${s.color}">${s.icon}</div>
      <div class="stat-info">
        <div class="stat-value">${s.value}</div>
        <div class="stat-label">${s.label}</div>
      </div>
    </div>
  `).join('');

  // Recent students
  document.getElementById('recent-students').innerHTML = students.slice(0, 5).map(s => `
    <tr>
      <td>${s.name}</td>
      <td><span class="badge badge-info">${s.class}</span></td>
      <td><span class="badge badge-success">${s.status}</span></td>
    </tr>
  `).join('');

  // Top performers
  const rankings = GradeCalc.getRankings(students, grades, '', 'Semester 1', '2025').slice(0, 5);
  document.getElementById('top-performers').innerHTML = rankings.map(s => `
    <tr>
      <td class="${s.rank <= 3 ? 'rank-' + s.rank : ''}">${s.rank === 1 ? '🥇' : s.rank === 2 ? '🥈' : s.rank === 3 ? '🥉' : '#' + s.rank}</td>
      <td>${s.name}</td>
      <td><strong>${s.average}%</strong></td>
    </tr>
  `).join('');

  // Grade distribution
  const gradeCounts = { A: 0, B: 0, C: 0, D: 0, F: 0 };
  grades.forEach(g => { if (gradeCounts[g.grade] !== undefined) gradeCounts[g.grade]++; });
  const total = grades.length || 1;
  const gradeColors = { A: '#34a853', B: '#1a73e8', C: '#fbbc04', D: '#ff6d00', F: '#ea4335' };

  document.getElementById('grade-dist').innerHTML = Object.entries(gradeCounts).map(([g, c]) => `
    <div style="flex:1;min-width:120px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span class="grade-${g.toLowerCase()}" style="font-weight:700;">Grade ${g}</span>
        <span style="font-size:13px;color:#5f6368;">${c} (${Math.round(c/total*100)}%)</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${Math.round(c/total*100)}%;background:${gradeColors[g]};"></div>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
