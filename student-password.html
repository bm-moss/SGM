<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password – SGM</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .portal-layout{display:flex;min-height:100vh;}
    .portal-sidebar{width:var(--sb-w,256px);background:var(--sidebar-bg,#1e1b4b);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;overflow-y:auto;}
    .portal-main{margin-left:var(--sb-w,256px);flex:1;display:flex;flex-direction:column;min-height:100vh;}
  </style>
</head>
<body>
<div class="portal-layout">
  <aside class="portal-sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">🏫</div>
      <div>
        <div class="school-name">SGM</div>
        <div class="school-sub">Student Portal</div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="s-avatar">S</div>
      <div class="user-info">
        <div class="user-name" id="s-name"></div>
        <div class="user-role" id="s-class" style="font-size:11px;color:rgba(255,255,255,.4);"></div>
      </div>
    </div>
    <nav id="s-nav" class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="Auth.logout()" style="color:#ff6b6b;width:100%;">
        <span class="nav-icon">🚪</span> Logout
      </button>
    </div>
  </aside>

  <div class="portal-main">
    <div class="topbar">
      <div class="topbar-title">Change Password</div>
    </div>

    <div class="page-content">
      <div class="card" style="max-width:460px;margin:0 auto;">
        <div class="card-header"><h3>🔑 Update Your Password</h3></div>
        <div class="card-body">
          <div class="alert alert-info" style="margin-bottom:20px;">
            Your password is private. Only you can change it here — administrators cannot view or change it.
          </div>
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="pw-current" placeholder="Enter your current password" />
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="pw-new" placeholder="At least 6 characters" />
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="pw-confirm" placeholder="Repeat new password" />
          </div>
          <div id="pw-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:14px;"></div>
          <button class="btn btn-primary btn-lg" onclick="changePassword()">Update Password</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/student-common.js"></script>
<script>
  const ctx = initStudentPortal();
  if (!ctx) throw new Error('init failed');
  const { user, studentRecord } = ctx;

  buildStudentSidebar('password', user, studentRecord);

  function changePassword() {
    const current = document.getElementById('pw-current').value;
    const newPw   = document.getElementById('pw-new').value;
    const confirm = document.getElementById('pw-confirm').value;
    const msgEl   = document.getElementById('pw-msg');

    function show(text, ok) {
      msgEl.style.display = 'block';
      msgEl.style.background = ok ? '#dcfce7' : '#fee2e2';
      msgEl.style.color = ok ? '#15803d' : '#b91c1c';
      msgEl.textContent = text;
    }

    if (!current || !newPw || !confirm) { show('All fields are required.', false); return; }
    if (newPw.length < 6) { show('New password must be at least 6 characters.', false); return; }
    if (newPw !== confirm) { show('New passwords do not match.', false); return; }

    const accounts = DB.get('accounts') || [];
    const idx = accounts.findIndex(a => a.id === user.id);
    if (idx === -1) { show('Account not found.', false); return; }
    if (accounts[idx].password !== current) { show('Current password is incorrect.', false); return; }

    accounts[idx].password = newPw;
    DB.set('accounts', accounts);

    // Update session so they don't get logged out
    const updated = { ...user, password: newPw };
    sessionStorage.setItem('sms_session', JSON.stringify(updated));

    show('✅ Password updated successfully!', true);
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    document.getElementById('pw-confirm').value = '';
  }
</script>
</body>
</html>
